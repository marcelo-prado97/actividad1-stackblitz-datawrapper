<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard CO₂ Datawrapper</title>
    <style>
      body {
        margin: 20px;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      .column {
        flex: 1;
        min-width: 300px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .full-width {
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <div style="text-align: center; margin-bottom: 40px">
      <h1>Emisiones CO₂ toneladas per cápita 2023</h1>
      <h2>Nombre: Enrique Calle Prado</h2>

      <p>
        <strong>URL del Proyecto:</strong><br />
        <a
          href="https://stackblitz.com/edit/stackblitz-starters-fm6hp3qj?file=index.html"
          target="_blank"
          style="color: #1a73e8; text-decoration: none; font-weight: bold"
        >
          Ver proyecto en StackBlitz
        </a>
      </p>

      <p>
        <strong>Repositorio en GitHub:</strong><br />

          style="color: #1a73e8; text-decoration: none; font-weight: bold"
        >
          Ver repositorio en GitHub
        </a>
      </p>
    </div>

    <div class="row">
      <!-- Columna Izquierda -->
      <div class="column">
        <!-- Países con mayor Per Capita de CO2 -->
        <iframe
          title="Países con mayor Per Capita de CO2"
          aria-label="Pie Chart"
          id="datawrapper-chart-ZSNfd"
          src="https://datawrapper.dwcdn.net/ZSNfd/2/"
          scrolling="no"
          frameborder="0"
          style="width: 0; min-width: 100% !important; border: none"
          height="409"
          data-external="1"
        ></iframe>
        <script type="text/javascript">
          !(function () {
            'use strict';

                    if (r.contentWindow === a.source) {
                      var d = a.data['datawrapper-height'][t] + 'px';
                      r.style.height = d;
                    }
              }
            });
          })();
        </script>
